[project]
name = "nova-oracle"
version = "0.1.0"
description = "Protein-ligand affinity scoring as a service, for NOVA (Bittensor subnet 68)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "anyio>=4.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/metanova-labs/nova-oracle"

# Runtime dependencies are locked per model in oracle/models/*/requirements.txt.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oracle*"]
