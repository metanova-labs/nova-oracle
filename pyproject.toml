[project]
name = "nova-oracle"
version = "0.1.0"
description = "Boltz-2 protein-ligand affinity scoring as a service, for NOVA (Bittensor subnet 68)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "anyio>=4.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/metanova-labs/nova-oracle"

# boltz and a CUDA-matched torch are installed separately against the host CUDA
# version; see README and deploy/provision.sh.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oracle"]
